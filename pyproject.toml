[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-lifeboat"
version = "0.1.0"
description = "Compile DataHub lineage into safe, executable recovery plans."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Lineage Lifeboat contributors" }
]
dependencies = [
  "acryl-datahub==1.6.0.15",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "mcp==1.28.1",
  "networkx>=3.4,<4",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["app"]
[tool.setuptools.package-data]
lineage_lifeboat = ["static/*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM117", "UP031"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["app"]

